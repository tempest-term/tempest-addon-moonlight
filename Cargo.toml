[workspace]
resolver = "2"
members = ["crates/moonlight-core", "crates/moonlight-addon", "crates/xtask"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/tempest-term/tempest-addon-moonlight"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openssl = "0.10"
tokio = { version = "1", features = ["rt", "macros", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[profile.release]
# The sidecar ships as a downloadable artifact per target; size is bandwidth.
opt-level = 2
lto = "thin"
strip = "debuginfo"
