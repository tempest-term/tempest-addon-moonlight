# Build, sign and publish the Moonlight addon.
#
# Signing happens here rather than in the Tempest repository, and no signing
# key exists anywhere: each job generates a keypair, has Vault certify the CSR
# with a one-hour TTL, signs, timestamps, and throws the key away with the
# runner. See docs/addon-signing.md in tempest-desktop.
#
# Authentication to Vault is by GitLab's OIDC ID token, not a static
# VAULT_TOKEN. A CI variable holding a Vault token would be a standing
# credential that outlives every job and leaks through any `env` dump; an ID
# token is minted per job, scoped to this project, and expires with it.

stages: [test, package, sign, publish]

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  # VAULT_ADDR is a project CI/CD variable, not a value here: this repository is
  # public, and the address of an internal service does not belong in it. It is
  # not a credential — the Vault role is bound to this project and to protected
  # refs, so knowing where Vault lives grants nothing — but publishing an
  # internal endpoint is free reconnaissance and there is no reason to.
  #
  # The mount and role names below stay, because they describe *this* project's
  # signing scheme rather than the infrastructure hosting it, and they are
  # documented in the host repository's docs/addon-signing.md anyway.
  VAULT_PKI_MOUNT: tempest-addon-intermediate-ca
  # The PKI role that issues the certificate, and the JWT role that authorises
  # asking for one. Different things, easy to confuse.
  VAULT_ROLE: tempest-addon
  VAULT_JWT_ROLE: tempest-addon-ci
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  # Must equal `ADDON_ABI` in the host's libtempest/src/addon/types.ts. Hand-
  # bumped in lockstep with it, never on its own — the app refuses any addon
  # whose descriptor disagrees, so a mismatch here ships a package nobody can
  # install. The sign job asserts the two are equal against the real source
  # rather than trusting this comment.
  ADDON_ABI: '1'

# Cargo's registry and the compiled vendor tree (OpenSSL, moonlight-common-c)
# are the whole build time; without this every job recompiles OpenSSL.
.cargo-cache: &cargo-cache
  cache:
    key:
      files: [Cargo.lock]
      prefix: $CI_JOB_NAME
    paths: [.cargo/registry, .cargo/git, target]

# ── Build ────────────────────────────────────────────────────────────────
# The target matrix is tempest-desktop's, exactly: linux x64 + arm64,
# **darwin arm64 only**, win32 x64 + arm64. An addon the app cannot be running
# beside is not worth building, and desktop dropped mac x86 for the same reason
# Apple did.
#
# Runner tags are desktop's too — `[linux, shell]`, `[macos]`, `[windows]`.
# There is no arm64 runner anywhere: every arm64 artifact is cross-compiled on
# an x64 host. Tagging `arm64` is what left the first pipeline stuck in pending
# with no matching runner.
#
# `image:` on a shell-executor job is inert. It is kept because desktop keeps
# it, and a diff between the two files should be a real difference.
.build-linux:
  stage: package
  image: oven/bun:1.3.9
  tags: [linux, shell]
  <<: *cargo-cache
  artifacts:
    paths: [dist/*.tpx]
    expire_in: 1 week

build:linux-x64:
  extends: .build-linux
  script:
    - cargo test --workspace --release
    - cargo xtask package

# Cross-compiled on the x64 host.
#
# `rustup target add` alone is not enough and fails late and confusingly: it
# installs the aarch64 *std*, but cargo still links with the host `cc`, and
# rust-lld reports every object as "incompatible with elf64-x86-64". The
# toolchain below is what actually retargets the link, and the vendored C
# (moonlight-common-c, enet, OpenSSL, aws-lc) reads the same CC_/CXX_/AR_ vars
# through the cc and cmake crates.
#
# ONE-TIME runner host setup — already done for tempest-desktop's arm64 jobs,
# which share this runner:
#   sudo dpkg --add-architecture arm64 && sudo apt-get update
#   sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu zlib1g-dev:arm64
build:linux-arm64:
  extends: .build-linux
  variables:
    CARGO_TARGET: aarch64-unknown-linux-gnu
    TPX_TARGET: linux-arm64
    CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
    CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
    AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
    PKG_CONFIG_ALLOW_CROSS: '1'
    # Without this, pkg-config answers with the host's amd64 .pc files and the
    # aarch64 binary quietly links amd64 libraries.
    PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
  before_script:
    - '[ -f ~/.bashrc ] && source ~/.bashrc'
    - rustup target add aarch64-unknown-linux-gnu
  script:
    - cargo xtask package
  # As in desktop: a cross-build hiccup must not block the native release.
  allow_failure: true

build:darwin-arm64:
  stage: package
  tags: [macos]
  <<: *cargo-cache
  script:
    - cargo test --workspace --release
    - cargo xtask package
  artifacts:
    paths: [dist/*.tpx]
    expire_in: 1 week

# Packaging is `cargo xtask package` everywhere, including here. This runner's
# shell is PowerShell and it has neither `bash` nor `zip` on PATH, and a `.ps1`
# beside a `.sh` would put the descriptor fields and the container layout in
# two places that must never disagree.
#
# CARGO_TARGET_DIR is desktop's MAX_PATH workaround — vendored OpenSSL's .obj
# paths overflow MSVC's limit under the default target/ inside the workspace.
.build-windows:
  stage: package
  tags: [windows]
  variables:
    CARGO_TARGET_DIR: 'C:\t'
  <<: *cargo-cache
  artifacts:
    paths: [dist/*.tpx]
    expire_in: 1 week

build:win32-x64:
  extends: .build-windows
  script:
    - cargo test --workspace --release
    - cargo xtask package

# Cross-compiled on the x64 Windows runner. Entering the x64→arm64 MSVC dev
# shell is what retargets cl/armasm64; it persists for the job's single
# PowerShell process, so the following step inherits it.
build:win32-arm64:
  extends: .build-windows
  variables:
    CARGO_TARGET: aarch64-pc-windows-msvc
    TPX_TARGET: win32-arm64
  before_script:
    - rustup target add aarch64-pc-windows-msvc
  script:
    - |
      $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
      Import-Module (Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
      Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=arm64 -host_arch=amd64'
    - cargo xtask package
  allow_failure: true

# ── Sign ─────────────────────────────────────────────────────────────────
# One signing job for every target at once: `ci-sign.sh` issues a single
# certificate per run and refuses a run whose packages disagree about which
# addon they are, so signing the whole matrix together is both cheaper and the
# shape the script expects.
sign:
  stage: sign
  image: oven/bun:1.3.9
  tags: [linux, shell]
  needs:
    - job: build:linux-x64
      artifacts: true
    - job: build:linux-arm64
      artifacts: true
    - job: build:darwin-arm64
      artifacts: true
    - job: build:win32-x64
      artifacts: true
    - job: build:win32-arm64
      artifacts: true
  id_tokens:
    VAULT_ID_TOKEN:
      # Must match the `bound_audiences` on the Vault JWT role.
      aud: $VAULT_ADDR
  # Vault's role is bound to `ref_protected: true`, so this job can only get a
  # certificate on a protected ref. That is deliberate: anyone who can open a
  # merge request can run a pipeline, and a pipeline that could sign would make
  # that the same privilege.
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  script:
    # Fail on the missing variable, not on the malformed URL it would produce.
    # Unset, the login below would POST to `/v1/auth/jwt/login` against nothing
    # and the error would be about curl, not about configuration.
    - |
      test -n "${VAULT_ADDR:-}" || {
        echo "VAULT_ADDR is not set — add it as a project CI/CD variable"; exit 1; }
    # Exchange the job's ID token for a short-lived Vault token, written to a
    # file rather than exported: an environment variable is readable from /proc
    # for the life of the process and is inherited by every child.
    - |
      umask 077
      curl -sS -f --request POST \
        --data "{\"jwt\":\"$VAULT_ID_TOKEN\",\"role\":\"$VAULT_JWT_ROLE\"}" \
        "$VAULT_ADDR/v1/auth/jwt/login" | jq -r '.auth.client_token' > vault.token
      test -s vault.token && [ "$(cat vault.token)" != null ] || {
        echo "Vault login failed — is this ref protected?"; exit 1; }
    # The signing scripts and the trust anchors live in the host repository —
    # this one is public and holds neither.
    - git clone --depth 1 "$TEMPEST_DESKTOP_REPO" /tmp/host
    # The one cross-repository invariant, checked against the source instead of
    # assumed. Everything downstream is keyed on this number: the publish path,
    # the URL the app derives from it, and the descriptor in every package.
    - |
      host_abi=$(sed -n 's/^export const ADDON_ABI = \([0-9]*\);.*/\1/p' \
        /tmp/host/packages/libtempest/src/addon/types.ts)
      test -n "$host_abi" || { echo "could not read ADDON_ABI from the host"; exit 1; }
      [ "$host_abi" = "$ADDON_ABI" ] || {
        echo "ABI mismatch: this repository builds $ADDON_ABI, the host speaks $host_abi"; exit 1; }
      echo "ABI $ADDON_ABI matches the host"
    - VAULT_TOKEN_FILE="$PWD/vault.token"
      CA_BUNDLE=/tmp/host/build/addon/ca_bundle.pem
      TSA_CA_FILE=/tmp/host/build/addon/tsa_roots.pem
      /tmp/host/scripts/addon-pki/ci-sign.sh dist/*.tpx
    - shred -u vault.token 2>/dev/null || rm -f vault.token
  artifacts:
    paths: [dist/*.tpx]
    expire_in: 1 month

# ── Publish ──────────────────────────────────────────────────────────────
# To a GitHub release, not a CDN of ours.
#
# The packages are GPL-3.0 and their source is that same repository, so putting
# the binaries beside it satisfies GPLv3 §6(d) — equivalent access to the
# Corresponding Source from the same place the object code is offered — with
# nothing to host and nothing to keep alive. A CDN bucket would have been one
# more thing to pay for and one more place for the source link to rot away
# from the binary.
#
# The tag is the release. `moonlight-<version>-<target>.tpx` keeps its full
# name as the asset name, so a downloaded file still says what it is.
publish:
  stage: publish
  tags: [linux, shell]
  needs: [sign]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      test -n "${GITHUB_TOKEN:-}" || {
        echo "GITHUB_TOKEN is not set — add it as a masked, protected CI/CD variable"; exit 1; }
      : "${GITHUB_REPO:=tempest-term/tempest-addon-moonlight}"
    # Create the release, or reuse it if a rerun already made one. GitHub
    # answers 422 for "already_exists", which is success on a retry and not
    # something to fail on.
    - |
      api="https://api.github.com/repos/$GITHUB_REPO"
      auth=(-H "Authorization: Bearer $GITHUB_TOKEN"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28")

      id=$(curl -sS "${auth[@]}" "$api/releases/tags/$CI_COMMIT_TAG" | jq -r '.id // empty')
      if [ -z "$id" ]; then
        id=$(jq -n --arg tag "$CI_COMMIT_TAG" \
               '{tag_name: $tag, name: $tag, draft: false, prerelease: false}' |
             curl -sS "${auth[@]}" -X POST --data @- "$api/releases" | jq -r '.id // empty')
      fi
      test -n "$id" || { echo "could not create or find release $CI_COMMIT_TAG"; exit 1; }
      echo "release $CI_COMMIT_TAG -> id $id"
      echo "$id" > release.id
    # Upload each signed package. A rerun deletes the previous asset first:
    # GitHub does not replace by name, it happily ends up with two.
    - |
      api="https://api.github.com/repos/$GITHUB_REPO"
      auth=(-H "Authorization: Bearer $GITHUB_TOKEN"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28")
      id=$(cat release.id)

      existing=$(curl -sS "${auth[@]}" "$api/releases/$id/assets")
      for f in dist/*.tpx; do
        name="$(basename "$f")"
        old=$(echo "$existing" | jq -r --arg n "$name" '.[] | select(.name == $n) | .id')
        [ -n "$old" ] && curl -sS "${auth[@]}" -X DELETE "$api/releases/assets/$old"
        echo "uploading $name ($(stat -c%s "$f") bytes)"
        curl -sS -f "${auth[@]}" \
          -H "Content-Type: application/zip" \
          --data-binary @"$f" \
          "https://uploads.github.com/repos/$GITHUB_REPO/releases/$id/assets?name=$name" \
          > /dev/null
      done
    # The app pins each build's URL, size and digest in a table compiled into
    # the binary (`ADDON_CATALOG`), which is a second check the download must
    # pass independently of its signature. So publishing is only half of a
    # release — the other half is a host-side change carrying these values.
    - |
      : "${GITHUB_REPO:=tempest-term/tempest-addon-moonlight}"
      echo
      echo "Add to libtempest/src/addon/catalog.ts:"
      for f in dist/*.tpx; do
        name="$(basename "$f")"
        target="$(basename "$f" .tpx | sed 's/^moonlight-[^-]*-//')"
        printf "  '%s': {\n    url: 'https://github.com/%s/releases/download/%s/%s',\n    bytes: %s,\n    sha256: '%s'\n  },\n" \
          "$target" "$GITHUB_REPO" "$CI_COMMIT_TAG" "$name" \
          "$(stat -c%s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
      done
